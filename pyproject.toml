[build-system]
requires = ['scikit-build-core>=0.10']
build-backend = 'scikit_build_core.build'

[project]
name = 'iguana'
description = 'Immersogeometric framework for boundary-unfitted analysis'
readme = 'README.md'
license = 'MIT AND BSD-3-Clause AND MPL-2.0'
license-files = ['LICENSE', 'THIRD_PARTY_NOTICES']
authors = [
    {name = 'Mario Caballero', email = 'mariocaballeroyus@gmail.com'},
]

requires-python = '>=3.9'

# petsc4py comes with the PETSc that IGUANA links, not from pip
dependencies = ['numpy>=1.21', 'scipy>=1.7']

dynamic = ['version']

[tool.scikit-build]
minimum-version = 'build-system.requires'

build-dir = 'build/{wheel_tag}'

wheel.packages = ['python/iguana']

cmake.version = '>=3.21'

sdist.exclude = ['build', '.github', '.pytest_cache']

[tool.scikit-build.cmake.define]
IGUANA_BUILD_PYTHON = 'ON'
BUILD_TESTING = 'OFF'

# Solving needs PETSc, which Windows lacks: Windows wheel is visualization-only
[[tool.scikit-build.overrides]]
if.platform-system = 'win32'
inherit.cmake.define = 'append'
cmake.define.IGUANA_WITH_PETSC = 'OFF'

[tool.scikit-build.metadata.version]
provider = 'scikit_build_core.metadata.regex'
input = 'CMakeLists.txt'
regex = 'project\(IGUANA VERSION (?P<value>[0-9.]+)'
