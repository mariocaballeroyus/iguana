name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install PETSc and the test dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends petsc-dev
          python3-dev python3-petsc4py python3-numpy python3-pytest

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DIGUANA_BUILD_PYTHON=ON
          -DCMAKE_BUILD_TYPE=Release
          -DPython_EXECUTABLE=/usr/bin/python3

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-wheel:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The wheel builds no tests, so it needs Eigen and pybind11 alone
      - name: Check out Eigen and pybind11
        run: >
          git submodule update --init --depth 1
          external/eigen external/pybind11

      # Rhino 8 embeds CPython 3.9, which uv installs in seconds
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build the wheel
        run: uv build --wheel --python 3.9 --out-dir dist

      - name: Test the wheel
        shell: bash
        run: |
          uv venv --python 3.9
          uv pip install dist/*.whl pytest
          .venv/Scripts/python -m pytest -q python/tests
