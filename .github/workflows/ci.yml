name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install PETSc and the test dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y petsc-dev python3-dev python3-petsc4py
          python3-numpy python3-scipy python3-pytest

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DIGUANA_BUILD_PYTHON=ON
          -DCMAKE_BUILD_TYPE=Release
          -DPython_EXECUTABLE=/usr/bin/python3

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-wheel:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install the wheel
        run: >
          python -m pip install iguana
          --no-index --no-deps --find-links dist

      - name: Test the wheel
        run: |
          python -m pip install pytest numpy scipy
          python -m pytest -q python/tests

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: iguana-cp39-win_amd64
          path: dist/*.whl
